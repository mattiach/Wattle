version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /src-tauri
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7